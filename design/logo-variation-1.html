<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blaze Veil Logo — Variation 1: B Circuit Core</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: system-ui, sans-serif;
  }
  .logo-container {
    width: 512px;
    height: 512px;
    position: relative;
  }
</style>
</head>
<body>
<div class="logo-container">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Cyan glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Clip to hexagon -->
    <clipPath id="hex-clip">
      <polygon points="256,24 464,144 464,368 256,488 48,368 48,144"/>
    </clipPath>
  </defs>

  <!-- Background hexagon - charcoal fill -->
  <polygon points="256,24 464,144 464,368 256,488 48,368 48,144"
           fill="#111827" stroke="#1e293b" stroke-width="2"/>

  <!-- Segmented outer arcs - top right -->
  <path d="M 256,24 Q 380,24 464,144"
        fill="none" stroke="#3FD4FF" stroke-width="3" stroke-linecap="round"
        opacity="0.7" filter="url(#glow)"/>
  <!-- Segmented outer arcs - right -->
  <path d="M 464,144 L 464,368"
        fill="none" stroke="#3FD4FF" stroke-width="3" stroke-linecap="round"
        opacity="0.5" filter="url(#glow)"/>
  <!-- Segmented outer arcs - bottom right -->
  <path d="M 464,368 Q 380,488 256,488"
        fill="none" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"
        opacity="0.7" filter="url(#glow)"/>
  <!-- Segmented outer arcs - bottom left -->
  <path d="M 256,488 Q 132,488 48,368"
        fill="none" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"
        opacity="0.5" filter="url(#glow)"/>
  <!-- Segmented outer arcs - left -->
  <path d="M 48,368 L 48,144"
        fill="none" stroke="#3FD4FF" stroke-width="3" stroke-linecap="round"
        opacity="0.4" filter="url(#glow)"/>
  <!-- Segmented outer arcs - top left -->
  <path d="M 48,144 Q 132,24 256,24"
        fill="none" stroke="#3FD4FF" stroke-width="3" stroke-linecap="round"
        opacity="0.6" filter="url(#glow)"/>

  <!-- Circuit trace lines emanating from center -->
  <g clip-path="url(#hex-clip)" opacity="0.4">
    <!-- Horizontal traces -->
    <line x1="180" y1="200" x2="80" y2="200" stroke="#3FD4FF" stroke-width="1.5"/>
    <line x1="80" y1="200" x2="60" y2="180" stroke="#3FD4FF" stroke-width="1.5"/>
    <line x1="80" y1="200" x2="60" y2="220" stroke="#3FD4FF" stroke-width="1.5"/>

    <line x1="332" y1="200" x2="432" y2="200" stroke="#3FD4FF" stroke-width="1.5"/>
    <line x1="432" y1="200" x2="452" y2="180" stroke="#3FD4FF" stroke-width="1.5"/>
    <line x1="432" y1="200" x2="452" y2="220" stroke="#3FD4FF" stroke-width="1.5"/>

    <!-- Vertical traces -->
    <line x1="256" y1="150" x2="256" y2="80" stroke="#3FD4FF" stroke-width="1.5"/>
    <line x1="256" y1="80" x2="240" y2="60" stroke="#3FD4FF" stroke-width="1.5"/>
    <line x1="256" y1="80" x2="272" y2="60" stroke="#3FD4FF" stroke-width="1.5"/>

    <line x1="256" y1="350" x2="256" y2="432" stroke="#FBBF24" stroke-width="1.5"/>
    <line x1="256" y1="432" x2="240" y2="452" stroke="#FBBF24" stroke-width="1.5"/>
    <line x1="256" y1="432" x2="272" y2="452" stroke="#FBBF24" stroke-width="1.5"/>

    <!-- Diagonal traces -->
    <line x1="195" y1="240" x2="130" y2="310" stroke="#3FD4FF" stroke-width="1"/>
    <line x1="130" y1="310" x2="110" y2="330" stroke="#3FD4FF" stroke-width="1"/>
    <line x1="317" y1="240" x2="382" y2="310" stroke="#FBBF24" stroke-width="1"/>
    <line x1="382" y1="310" x2="402" y2="330" stroke="#FBBF24" stroke-width="1"/>

    <line x1="195" y1="310" x2="130" y2="240" stroke="#3FD4FF" stroke-width="1"/>
    <line x1="317" y1="310" x2="382" y2="240" stroke="#FBBF24" stroke-width="1"/>
  </g>

  <!-- Small circuit nodes -->
  <g clip-path="url(#hex-clip)">
    <circle cx="80" cy="200" r="4" fill="#3FD4FF" filter="url(#glow)"/>
    <circle cx="432" cy="200" r="4" fill="#3FD4FF" filter="url(#glow)"/>
    <circle cx="256" cy="80" r="4" fill="#3FD4FF" filter="url(#glow)"/>
    <circle cx="256" cy="432" r="4" fill="#FBBF24" filter="url(#glow)"/>
    <circle cx="130" cy="310" r="3" fill="#3FD4FF" filter="url(#glow)"/>
    <circle cx="382" cy="310" r="3" fill="#FBBF24" filter="url(#glow)"/>
    <circle cx="130" cy="240" r="3" fill="#3FD4FF" filter="url(#glow)"/>
    <circle cx="382" cy="240" r="3" fill="#FBBF24" filter="url(#glow)"/>
  </g>

  <!-- Central "B" letterform - circuit trace style -->
  <g filter="url(#glow)">
    <!-- B spine -->
    <line x1="210" y1="185" x2="210" y2="325" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <!-- B top curve -->
    <path d="M 210,185 Q 210,175 220,175 L 280,175 Q 310,175 310,200 Q 310,225 280,230 L 210,230"
          fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- B bottom curve -->
    <path d="M 210,230 Q 210,225 220,225 L 290,225 Q 325,225 325,260 Q 325,295 290,300 L 210,300"
          fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Circuit node on B spine -->
    <circle cx="210" y="185" r="5" fill="#3FD4FF" filter="url(#glow)"/>
    <circle cx="210" cy="230" r="5" fill="#FFFFFF" filter="url(#glow)"/>
    <circle cx="210" cy="300" r="5" fill="#FBBF24" filter="url(#glow)"/>

    <!-- B terminal dots -->
    <circle cx="310" cy="200" r="4" fill="#3FD4FF" filter="url(#glow)"/>
    <circle cx="325" cy="260" r="4" fill="#FBBF24" filter="url(#glow)"/>
  </g>

  <!-- Hidden eye / aperture - subtle, behind B -->
  <g opacity="0.15">
    <ellipse cx="265" cy="252" rx="45" ry="30" fill="none" stroke="#3FD4FF" stroke-width="1.5"/>
    <circle cx="265" cy="252" r="12" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="265" cy="252" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Inner hexagon accent ring -->
  <polygon points="256,80 400,170 400,342 256,432 112,342 112,170"
           fill="none" stroke="#3FD4FF" stroke-width="1" opacity="0.2"/>

  <!-- Corner accent dots on hexagon vertices -->
  <circle cx="256" cy="24" r="6" fill="#3FD4FF" filter="url(#glow)"/>
  <circle cx="464" cy="144" r="6" fill="#3FD4FF" filter="url(#glow)"/>
  <circle cx="464" cy="368" r="6" fill="#FBBF24" filter="url(#glow)"/>
  <circle cx="256" cy="488" r="6" fill="#FBBF24" filter="url(#glow)"/>
  <circle cx="48" cy="368" r="6" fill="#3FD4FF" filter="url(#glow)"/>
  <circle cx="48" cy="144" r="6" fill="#3FD4FF" filter="url(#glow)"/>
</svg>
</div>
</body>
</html>
