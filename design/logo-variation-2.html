<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blaze Veil Logo — Variation 2: Eye Aperture</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: system-ui, sans-serif;
  }
  .logo-container {
    width: 512px;
    height: 512px;
    position: relative;
  }
</style>
</head>
<body>
<div class="logo-container">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="hex-clip">
      <polygon points="256,24 464,144 464,368 256,488 48,368 48,144"/>
    </clipPath>
    <!-- Radial gradient for eye -->
    <radialGradient id="eye-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3FD4FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3FD4FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background hexagon -->
  <polygon points="256,24 464,144 464,368 256,488 48,368 48,144"
           fill="#111827" stroke="#1e293b" stroke-width="2"/>

  <!-- Inner subtle hex grid pattern -->
  <g clip-path="url(#hex-clip)" opacity="0.06">
    <polygon points="256,120 360,180 360,300 256,360 152,300 152,180"
             fill="none" stroke="#3FD4FF" stroke-width="1"/>
    <polygon points="256,160 330,205 330,275 256,320 182,275 182,205"
             fill="none" stroke="#3FD4FF" stroke-width="1"/>
    <polygon points="256,200 300,230 300,250 256,280 212,250 212,230"
             fill="none" stroke="#3FD4FF" stroke-width="1"/>
  </g>

  <!-- Segmented arcs - outer ring -->
  <g clip-path="url(#hex-clip)">
    <!-- Arc segments - top right quadrant -->
    <path d="M 280,100 A 160,160 0 0,1 400,180"
          fill="none" stroke="#3FD4FF" stroke-width="2.5" stroke-linecap="round"
          opacity="0.8" filter="url(#glow)"/>
    <!-- Right -->
    <path d="M 412,200 A 160,160 0 0,1 412,310"
          fill="none" stroke="#3FD4FF" stroke-width="2.5" stroke-linecap="round"
          opacity="0.6" filter="url(#glow)"/>
    <!-- Bottom right -->
    <path d="M 400,340 A 160,160 0 0,1 300,420"
          fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"
          opacity="0.8" filter="url(#glow)"/>
    <!-- Bottom left -->
    <path d="M 220,420 A 160,160 0 0,1 112,340"
          fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"
          opacity="0.6" filter="url(#glow)"/>
    <!-- Left -->
    <path d="M 100,310 A 160,160 0 0,1 100,200"
          fill="none" stroke="#3FD4FF" stroke-width="2.5" stroke-linecap="round"
          opacity="0.5" filter="url(#glow)"/>
    <!-- Top left -->
    <path d="M 112,180 A 160,160 0 0,1 232,100"
          fill="none" stroke="#3FD4FF" stroke-width="2.5" stroke-linecap="round"
          opacity="0.7" filter="url(#glow)"/>
  </g>

  <!-- Eye / Aperture - central feature -->
  <g filter="url(#glow-strong)">
    <!-- Outer eye shape - almond/vesica -->
    <path d="M 160,256 Q 256,170 352,256 Q 256,342 160,256 Z"
          fill="none" stroke="#3FD4FF" stroke-width="3" opacity="0.9"/>
    <!-- Inner eye shape -->
    <path d="M 195,256 Q 256,200 317,256 Q 256,312 195,256 Z"
          fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
    <!-- Iris -->
    <circle cx="256" cy="256" r="28" fill="none" stroke="#3FD4FF" stroke-width="2.5" opacity="0.8"/>
    <!-- Pupil -->
    <circle cx="256" cy="256" r="12" fill="#3FD4FF" opacity="0.9"/>
    <!-- Pupil highlight -->
    <circle cx="250" cy="250" r="4" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Iris ring details -->
  <g opacity="0.4">
    <circle cx="256" cy="256" r="20" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-dasharray="2,4"/>
    <circle cx="256" cy="256" r="35" fill="none" stroke="#3FD4FF" stroke-width="0.5" stroke-dasharray="3,6"/>
  </g>

  <!-- Aperture blades - subtle mechanical detail -->
  <g opacity="0.25" clip-path="url(#hex-clip)">
    <line x1="256" y1="220" x2="220" y2="190" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="256" y1="220" x2="292" y2="190" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="288" y1="240" x2="318" y2="225" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="288" y1="272" x2="318" y2="287" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="256" y1="292" x2="292" y2="322" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="256" y1="292" x2="220" y2="322" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="224" y1="272" x2="194" y2="287" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="224" y1="240" x2="194" y2="225" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Circuit traces radiating from eye -->
  <g clip-path="url(#hex-clip)" opacity="0.35">
    <!-- Top traces -->
    <line x1="256" y1="225" x2="256" y2="120" stroke="#3FD4FF" stroke-width="1.5"/>
    <line x1="256" y1="120" x2="240" y2="100" stroke="#3FD4FF" stroke-width="1"/>
    <line x1="256" y1="120" x2="272" y2="100" stroke="#3FD4FF" stroke-width="1"/>

    <!-- Bottom traces -->
    <line x1="256" y1="287" x2="256" y2="400" stroke="#FBBF24" stroke-width="1.5"/>
    <line x1="256" y1="400" x2="240" y2="420" stroke="#FBBF24" stroke-width="1"/>
    <line x1="256" y1="400" x2="272" y2="420" stroke="#FBBF24" stroke-width="1"/>

    <!-- Left traces -->
    <line x1="224" y1="256" x2="120" y2="256" stroke="#3FD4FF" stroke-width="1.5"/>
    <line x1="120" y1="256" x2="100" y2="240" stroke="#3FD4FF" stroke-width="1"/>
    <line x1="120" y1="256" x2="100" y2="272" stroke="#3FD4FF" stroke-width="1"/>

    <!-- Right traces -->
    <line x1="288" y1="256" x2="400" y2="256" stroke="#3FD4FF" stroke-width="1.5"/>
    <line x1="400" y1="256" x2="420" y2="240" stroke="#3FD4FF" stroke-width="1"/>
    <line x1="400" y1="256" x2="420" y2="272" stroke="#3FD4FF" stroke-width="1"/>

    <!-- Diagonal traces -->
    <line x1="237" y1="237" x2="160" y2="160" stroke="#3FD4FF" stroke-width="1"/>
    <line x1="275" y1="237" x2="352" y2="160" stroke="#3FD4FF" stroke-width="1"/>
    <line x1="237" y1="275" x2="160" y2="352" stroke="#FBBF24" stroke-width="1"/>
    <line x1="275" y1="275" x2="352" y2="352" stroke="#FBBF24" stroke-width="1"/>
  </g>

  <!-- Circuit nodes -->
  <g clip-path="url(#hex-clip)">
    <circle cx="256" cy="120" r="4" fill="#3FD4FF" filter="url(#glow)"/>
    <circle cx="256" cy="400" r="4" fill="#FBBF24" filter="url(#glow)"/>
    <circle cx="120" cy="256" r="4" fill="#3FD4FF" filter="url(#glow)"/>
    <circle cx="400" cy="256" r="4" fill="#3FD4FF" filter="url(#glow)"/>
    <circle cx="160" cy="160" r="3" fill="#3FD4FF" filter="url(#glow)"/>
    <circle cx="352" cy="160" r="3" fill="#3FD4FF" filter="url(#glow)"/>
    <circle cx="160" cy="352" r="3" fill="#FBBF24" filter="url(#glow)"/>
    <circle cx="352" cy="352" r="3" fill="#FBBF24" filter="url(#glow)"/>
  </g>

  <!-- Hexagon vertex accents -->
  <circle cx="256" cy="24" r="5" fill="#3FD4FF" filter="url(#glow)"/>
  <circle cx="464" cy="144" r="5" fill="#3FD4FF" filter="url(#glow)"/>
  <circle cx="464" cy="368" r="5" fill="#FBBF24" filter="url(#glow)"/>
  <circle cx="256" cy="488" r="5" fill="#FBBF24" filter="url(#glow)"/>
  <circle cx="48" cy="368" r="5" fill="#3FD4FF" filter="url(#glow)"/>
  <circle cx="48" cy="144" r="5" fill="#3FD4FF" filter="url(#glow)"/>

  <!-- Small "B" mark - bottom right, subtle -->
  <g opacity="0.5">
    <text x="370" y="400" font-family="system-ui, sans-serif" font-size="28" font-weight="700"
          fill="#FFFFFF" letter-spacing="-1">B</text>
    <text x="390" y="400" font-family="system-ui, sans-serif" font-size="28" font-weight="300"
          fill="#3FD4FF" letter-spacing="-1">V</text>
  </g>
</svg>
</div>
</body>
</html>
