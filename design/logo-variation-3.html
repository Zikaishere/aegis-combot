<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blaze Veil Logo — Variation 3: Minimal Geometry</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: system-ui, sans-serif;
  }
  .logo-container {
    width: 512px;
    height: 512px;
    position: relative;
  }
</style>
</head>
<body>
<div class="logo-container">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-subtle" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="hex-clip">
      <polygon points="256,24 464,144 464,368 256,488 48,368 48,144"/>
    </clipPath>
  </defs>

  <!-- Background hexagon - clean, no stroke -->
  <polygon points="256,24 464,144 464,368 256,488 48,368 48,144"
           fill="#111827"/>

  <!-- Minimal inner hexagon -->
  <polygon points="256,72 424,168 424,344 256,440 88,344 88,168"
           fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Segmented arcs - only 3, asymmetric -->
  <g clip-path="url(#hex-clip)">
    <!-- Top arc - cyan -->
    <path d="M 200,60 A 200,200 0 0,1 380,120"
          fill="none" stroke="#3FD4FF" stroke-width="4" stroke-linecap="round"
          opacity="0.9" filter="url(#glow)"/>
    <!-- Bottom right arc - amber -->
    <path d="M 420,340 A 200,200 0 0,1 300,460"
          fill="none" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"
          opacity="0.9" filter="url(#glow)"/>
    <!-- Left arc - cyan, thinner -->
    <path d="M 70,280 A 200,200 0 0,1 120,140"
          fill="none" stroke="#3FD4FF" stroke-width="2.5" stroke-linecap="round"
          opacity="0.5" filter="url(#glow-subtle)"/>
  </g>

  <!-- Geometric "B" - constructed from clean lines -->
  <g filter="url(#glow-subtle)">
    <!-- Vertical spine -->
    <line x1="220" y1="195" x2="220" y2="315" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>

    <!-- Top bowl -->
    <path d="M 220,195 L 290,195 Q 310,195 310,215 Q 310,235 290,237 L 220,237"
          fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bottom bowl - slightly larger -->
    <path d="M 220,237 L 300,237 Q 330,237 330,265 Q 330,293 300,295 L 220,295"
          fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Terminal nodes -->
    <circle cx="220" cy="195" r="5" fill="#3FD4FF" filter="url(#glow)"/>
    <circle cx="220" cy="237" r="4" fill="#FFFFFF"/>
    <circle cx="220" cy="295" r="5" fill="#FBBF24" filter="url(#glow)"/>
    <circle cx="310" cy="215" r="4" fill="#3FD4FF" filter="url(#glow)"/>
    <circle cx="330" cy="265" r="4" fill="#FBBF24" filter="url(#glow)"/>
  </g>

  <!-- Minimal circuit traces - just a few -->
  <g clip-path="url(#hex-clip)" opacity="0.3">
    <!-- From B top node going left -->
    <line x1="220" y1="195" x2="140" y2="195" stroke="#3FD4FF" stroke-width="1.5"/>
    <line x1="140" y1="195" x2="120" y2="175" stroke="#3FD4FF" stroke-width="1"/>

    <!-- From B bottom node going right -->
    <line x1="220" y1="295" x2="320" y2="295" stroke="#FBBF24" stroke-width="1.5"/>
    <line x1="320" y1="295" x2="340" y2="315" stroke="#FBBF24" stroke-width="1"/>

    <!-- From top bowl terminal going up -->
    <line x1="310" y1="215" x2="310" y2="140" stroke="#3FD4FF" stroke-width="1.5"/>
    <line x1="310" y1="140" x2="295" y2="120" stroke="#3FD4FF" stroke-width="1"/>
    <line x1="310" y1="140" x2="325" y2="120" stroke="#3FD4FF" stroke-width="1"/>
  </g>

  <!-- Circuit nodes -->
  <g clip-path="url(#hex-clip)">
    <circle cx="140" cy="195" r="3.5" fill="#3FD4FF" filter="url(#glow)"/>
    <circle cx="320" cy="295" r="3.5" fill="#FBBF24" filter="url(#glow)"/>
    <circle cx="310" cy="140" r="3.5" fill="#3FD4FF" filter="url(#glow)"/>
  </g>

  <!-- Hidden eye - very minimal, just a dot and two arcs -->
  <g opacity="0.2">
    <circle cx="270" cy="255" r="6" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <circle cx="270" cy="255" r="2" fill="#FFFFFF"/>
    <!-- Subtle eye lid arcs -->
    <path d="M 255,255 Q 270,242 285,255" fill="none" stroke="#FFFFFF" stroke-width="0.8"/>
    <path d="M 255,255 Q 270,268 285,255" fill="none" stroke="#FFFFFF" stroke-width="0.8"/>
  </g>

  <!-- Hexagon vertex dots - subtle -->
  <circle cx="256" cy="24" r="4" fill="#3FD4FF" opacity="0.6" filter="url(#glow-subtle)"/>
  <circle cx="464" cy="144" r="4" fill="#3FD4FF" opacity="0.4" filter="url(#glow-subtle)"/>
  <circle cx="464" cy="368" r="4" fill="#FBBF24" opacity="0.5" filter="url(#glow-subtle)"/>
  <circle cx="256" cy="488" r="4" fill="#FBBF24" opacity="0.6" filter="url(#glow-subtle)"/>
  <circle cx="48" cy="368" r="4" fill="#3FD4FF" opacity="0.4" filter="url(#glow-subtle)"/>
  <circle cx="48" cy="144" r="4" fill="#3FD4FF" opacity="0.5" filter="url(#glow-subtle)"/>
</svg>
</div>
</body>
</html>
